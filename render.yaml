# Render Blueprint — Finanza v3 (Supabase ou Render DB)
# Deploy: render.com/deploy → New Blueprint → conectar repo

services:
  - type: web
    name: finanza-api
    runtime: node
    region: ohio
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # ← cole a URL do Supabase/Neon/Render DB aqui
      - key: API_SECRET
        generateValue: true  # ← chave admin gerada automaticamente
    autoDeploy: true
