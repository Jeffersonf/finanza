services:
  - type: web
    name: finanza-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finanza-db
          property: connectionString
      - key: API_SECRET
        sync: false        # você preenche manualmente no painel do Render
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

databases:
  - name: finanza-db
    databaseName: finanza
    user: finanza_user
    plan: free
    region: oregon
