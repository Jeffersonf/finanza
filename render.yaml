services:
  - type: web
    name: finanza-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: DATABASE_URL
        sync: false        # Cole aqui a connection string PostgreSQL do Supabase
      - key: API_SECRET
        sync: false        # Chave admin preenchida manualmente no painel do Render
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
